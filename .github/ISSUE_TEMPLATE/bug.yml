name: Bug report
description: Report a reproducible problem using synthetic or redacted data.
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, balances, private messages, follower identities, full database exports or live-account screenshots. Security issues belong in the private process described in SECURITY.md."
  - type: input
    id: version
    attributes:
      label: App version and macOS version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result and actual result
      description: Use the offline demo or a minimal synthetic fixture where possible.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy review
      options:
        - label: I removed credentials, personal data and local machine paths from this report.
          required: true
